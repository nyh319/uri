<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리</title>
<!-- 아이폰 홈 화면: 이름·아이콘·주소창 없는 전체 화면 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #f6f4ef; }
  /* 앱스 스크립트 웹앱을 화면 전체에 깐다. 이렇게 넣으면 구글 안내 배너가 안 뜬다. */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .msg { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color: #1d1b1a;
         padding: 40px 24px; text-align: center; line-height: 1.6; }

  /* 로딩 화면: 달력이 다 뜰 때까지 서명 로고를 띄운다 */
  #splash { position: fixed; inset: 0; z-index: 2; background: #f6f4ef;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
            transition: opacity .7s ease, visibility .7s; }
  #splash.done { opacity: 0; visibility: hidden; }
  /* 서명: es → ♥ → yh 순서로 하나씩 스윽. 세 장은 같은 크기 캔버스라 겹치면 원래 서명이 된다. */
  #splash .sig { position: relative; width: min(60vw, 260px); aspect-ratio: 736 / 264;
                 animation: breathe 3.2s ease-in-out 4.4s infinite; }
  #splash .sig img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  /* 글씨는 왼쪽에서 오른쪽으로 천천히 써 내려가듯 드러난다. 앞 글자가 끝나 갈 무렵 다음이 이어서 시작. */
  #splash .es { clip-path: inset(0 100% 0 0); filter: blur(4px);
                animation: write-es 1.8s cubic-bezier(.45,0,.25,1) .3s forwards; }
  #splash .heart { transform-origin: 44% 58%; transform: scale(.6); filter: blur(4px);
                   animation: pop 1.3s cubic-bezier(.3,1.2,.4,1) 1.5s forwards; }
  #splash .yh { clip-path: inset(0 46% 0 54%); filter: blur(4px);
                animation: write-yh 2s cubic-bezier(.45,0,.25,1) 2.1s forwards; }
  @keyframes write-es { to { clip-path: inset(0 0 0 0); filter: blur(0); opacity: 1; } }
  @keyframes write-yh { to { clip-path: inset(0 0 0 54%); filter: blur(0); opacity: 1; } }
  @keyframes pop { to { transform: scale(1); filter: blur(0); opacity: 1; } }

  #splash .dots { display: flex; gap: 7px; opacity: 0; animation: show .8s ease 3.8s forwards; }
  #splash .dots i { width: 6px; height: 6px; border-radius: 50%; background: #ff6b8b; opacity: .25;
                    animation: dot 1.2s ease-in-out infinite; }
  #splash .dots i:nth-child(2) { animation-delay: .2s; }
  #splash .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes show { to { opacity: 1; } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) {
    #splash .sig, #splash .sig img, #splash .dots, #splash .dots i { animation: show .3s forwards; clip-path: none; filter: none; transform: none; }
  }
</style>
</head>
<body>
<div id="splash" role="status" aria-label="불러오는 중">
  <div class="sig" aria-label="es ♥ yh">
    <img class="es" src="logo-es.png" alt="">
    <img class="heart" src="logo-heart.png" alt="">
    <img class="yh" src="logo-yh.png" alt="">
  </div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>
<script>
  // 앱이 첫 달력을 다 그리면 'uri-ready'를 보내 온다. 달력은 뒤에서 동시에 불러오므로 로딩 화면 때문에 늦어지지 않는다.
  // 서명이 다 써지기(약 4.1초) 전에 달력이 먼저 준비되면, 남은 서명을 4배 빠르게 마저 쓰고 걷는다.
  // 신호가 안 와도 20초 뒤엔 걷는다.
  var splashStart = Date.now(), SIGN_DONE = 4100, FAST = 4;
  function hideSplash() { document.getElementById('splash').classList.add('done'); }
  window.addEventListener('message', function (e) {
    if (e.data !== 'uri-ready') return;
    var left = SIGN_DONE - (Date.now() - splashStart);
    if (left <= 0) return hideSplash();
    try {
      document.getElementById('splash').getAnimations({ subtree: true })
        .forEach(function (a) { a.updatePlaybackRate(FAST); });
      setTimeout(hideSplash, left / FAST);
    } catch (err) { hideSplash(); }
  });
  setTimeout(hideSplash, 20000);
</script>
<script>
  // 앱스 스크립트 웹앱 주소. 접근 키(k)는 저장소에 넣지 않고 이 페이지 주소의 ?k= 로만 받는다.
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwP8hLPqnPgkItHE2Gh1FOszHqmOGTLdfU6g493GFy2s41gh1qQ34mpgFi9WR27hPUx/exec';

  var key = new URLSearchParams(location.search).get('k') || '';
  // 홈 화면 앱이 키 없이 열리는 경우를 대비해 이 기기에만 기억해 둔다
  try {
    if (key) localStorage.setItem('k', key); else key = localStorage.getItem('k') || '';
  } catch (e) {}

  if (key) {
    var f = document.createElement('iframe');
    f.src = APP_URL + '?k=' + encodeURIComponent(key);
    f.title = '우리';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<p class="msg">주소가 올바르지 않습니다.<br>받은 주소 그대로 열어 주세요.</p>';
  }
</script>
</body>
</html>
